name: Deploy NKAI Studio to Hugging Face Spaces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NKAI Studio
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub
      - name: Upload app to the configured Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Configure repository secrets HF_TOKEN and HF_SPACE_ID first."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_ID"]
          if "/" not in repo_id or len(repo_id.split("/")) != 2:
              raise SystemExit("HF_SPACE_ID must be the owner/space-name of an existing Space.")
          api = HfApi(token=token)
          try:
              api.repo_info(repo_id=repo_id, repo_type="space")
          except Exception:
              print(f"Space {repo_id} was not found; attempting to create a Docker Space.")
              api.create_repo(
                  repo_id=repo_id,
                  repo_type="space",
                  space_sdk="docker",
                  exist_ok=True,
                  token=token,
              )
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  ".git/**", ".github/**", "node_modules/**", ".output/**",
                  "downloads/**", "openvoice-checkpoints/**", "voice-secrets/**",
                  ".env", ".env.*", "!.env.example", "*.log", "coverage/**",
              ],
              commit_message="Deploy NKAI Studio from GitHub Actions",
              token=token,
          )
          import time
          import urllib.error
          import urllib.request

          print(f"Uploaded source to Hugging Face Space {repo_id}. Waiting for the Docker Space to start.")
          deadline = time.time() + 900
          last_stage = "unknown"
          while time.time() < deadline:
              runtime = api.get_space_runtime(repo_id=repo_id, token=token)
              stage = getattr(runtime, "stage", "unknown") if runtime else "unknown"
              if stage != last_stage:
                  print(f"Space runtime stage: {stage}")
                  last_stage = stage
              if stage == "RUNNING":
                  break
              if stage in {"BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR", "NO_APP_FILE"}:
                  raise SystemExit(f"Hugging Face Space failed with runtime stage: {stage}")
              time.sleep(15)
          else:
              raise SystemExit(f"Timed out waiting for Hugging Face Space to start; last stage was {last_stage}. Check the Space build/runtime logs.")

          base_url = "https://" + repo_id.replace("/", "-").lower() + ".hf.space"
          # Confirm the app serves its real diagnostic route after the container starts.
          request = urllib.request.Request(base_url + "/deployment", headers={"User-Agent": "NKAI-Studio-deployment-check"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"Space started but /deployment returned HTTP {response.status}")
                  page = response.read(1_000_000).decode("utf-8", errors="replace")
                  if "NKAI STUDIO" not in page.upper() and "deployment" not in page.lower():
                      raise SystemExit("Space returned HTTP 200 but the NKAI deployment diagnostic page marker was not found.")
                  print(f"Deployment smoke test passed: {base_url}/deployment (HTTP {response.status}).")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Space runtime is RUNNING but /deployment returned HTTP {exc.code}. Check app logs.") from exc
          except Exception as exc:
              raise SystemExit(f"Space runtime is RUNNING but the /deployment smoke test failed: {exc}") from exc
          PY
