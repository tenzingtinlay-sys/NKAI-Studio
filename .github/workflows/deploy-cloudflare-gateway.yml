name: Deploy Cloudflare Live Avatar Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-live-avatar-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REGISTER_SECRET: ${{ secrets.NKAI_GATEWAY_REGISTER_SECRET }}
      AI_REGISTER_SECRET: ${{ secrets.NKAI_AI_REGISTER_SECRET }}
      AI_CLIENT_SECRET: ${{ secrets.NKAI_AI_CLIENT_SECRET }}
      AI_WORKER_TOKEN: ${{ secrets.NKAI_AI_WORKER_TOKEN }}
      ALLOWED_ORIGINS: ${{ secrets.NKAI_FRONTEND_ORIGIN }}
    steps:
      - name: Check required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN REGISTER_SECRET AI_REGISTER_SECRET AI_CLIENT_SECRET AI_WORKER_TOKEN ALLOWED_ORIGINS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub Actions secret for ${key}. See gateway/README.md."
              exit 1
            fi
          done
          node -e 'const u = new URL(process.env.ALLOWED_ORIGINS); if (u.protocol !== "https:" || u.origin !== process.env.ALLOWED_ORIGINS || u.pathname !== "/") process.exit(1)' || {
            echo "::error::NKAI_FRONTEND_ORIGIN must be a single HTTPS origin without a path or trailing slash."
            exit 1
          }
          if [[ "${#AI_REGISTER_SECRET}" -lt 32 || "${#AI_CLIENT_SECRET}" -lt 32 || "${#AI_WORKER_TOKEN}" -lt 16 ]]; then
            echo "::error::AI_REGISTER_SECRET and AI_CLIENT_SECRET must be at least 32 characters; AI_WORKER_TOKEN must be at least 16 characters."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker with strict origin allowlist
        shell: bash
        run: |
          set -euo pipefail
          cd gateway
          wrangler deploy src/index.js --config wrangler.toml --name nkai-avatar-gateway --var "ALLOWED_ORIGINS:${ALLOWED_ORIGINS}" 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
          GATEWAY_URL="$(grep -Eo 'https://nkai-avatar-gateway\.[a-zA-Z0-9-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | tail -n 1 || true)"
          if [[ -z "$GATEWAY_URL" ]]; then
            echo "::error::Could not detect the deployed workers.dev URL from Wrangler output."
            exit 1
          fi
          echo "GATEWAY_URL=$GATEWAY_URL" >> "$GITHUB_ENV"

      - name: Set private gateway and AI worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTER_SECRET" | wrangler secret put REGISTER_SECRET --config gateway/wrangler.toml
          printf '%s' "$AI_REGISTER_SECRET" | wrangler secret put AI_REGISTER_SECRET --config gateway/wrangler.toml
          printf '%s' "$AI_CLIENT_SECRET" | wrangler secret put AI_CLIENT_SECRET --config gateway/wrangler.toml
          printf '%s' "$AI_WORKER_TOKEN" | wrangler secret put AI_WORKER_TOKEN --config gateway/wrangler.toml

      - name: Verify public gateway and origin policy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$GATEWAY_URL/health" | tee "$RUNNER_TEMP/gateway-health.json"
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/gateway-health.json","utf8")); if(j.gateway!==true || !Array.isArray(j.servers)) process.exit(1); console.log("\nGateway health schema OK; registered LiveTalking hosts:", j.servers.length)'
          curl --fail --silent --show-error -D "$RUNNER_TEMP/cors-headers.txt" -o /dev/null -H "Origin: $ALLOWED_ORIGINS" "$GATEWAY_URL/health"
          grep -Fqi "access-control-allow-origin: $ALLOWED_ORIGINS" "$RUNNER_TEMP/cors-headers.txt" || {
            echo "::error::Configured frontend origin was not returned by the gateway CORS policy."
            exit 1
          }
          echo "Gateway URL: $GATEWAY_URL"

      - name: Verify AI proxy authentication and worker readiness
        shell: bash
        run: |
          set -euo pipefail
          # Invalid/missing credentials must be rejected; this catches a missing
          # AI_CLIENT_SECRET binding or a proxy route that was not deployed.
          unauth_code="$(curl --silent --output "$RUNNER_TEMP/ai-unauth.json" --write-out '%{http_code}' "$GATEWAY_URL/api/ai/health")"
          if [[ "$unauth_code" != "401" ]]; then
            echo "::error::AI health route should reject unauthenticated requests with HTTP 401, got $unauth_code."
            cat "$RUNNER_TEMP/ai-unauth.json"
            exit 1
          fi

          # With the configured secret, 200 means a registered worker is ready;
          # 503 is an honest, expected deployment state if Colab is stopped or
          # its 90-second registration has expired. Other responses are failures.
          ai_code="$(curl --silent --output "$RUNNER_TEMP/ai-health.json" --write-out '%{http_code}' -H "Authorization: Bearer $AI_CLIENT_SECRET" "$GATEWAY_URL/api/ai/health")"
          case "$ai_code" in
            200)
              node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/ai-health.json","utf8")); if(j.status!=="ready" || !j.worker) process.exit(1); console.log("AI gateway ready; worker:", j.worker)'
              ;;
            503)
              node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/ai-health.json","utf8")); if(j.status!=="unavailable") process.exit(1); console.log("AI gateway route and credentials verified, but no healthy AI worker is registered.")'
              echo "::warning::Start the Colab Qwen worker and run gateway/register_ai_worker.py; worker registrations expire after 90 seconds without heartbeats."
              ;;
            *)
              echo "::error::Authenticated AI health check returned unexpected HTTP $ai_code."
              cat "$RUNNER_TEMP/ai-health.json"
              exit 1
              ;;
          esac

          echo "Gateway deployed. AI readiness above is separate from LiveTalking/WebRTC media verification."
