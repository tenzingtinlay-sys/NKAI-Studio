name: Verify NKAI Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nkai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      # TanStack Start generates routeTree.gen.ts during the Vite build.
      # Run TypeScript after route generation so new file routes are included.
      - name: Production build
        run: npm run build
      - name: TypeScript check
        run: npm run typecheck
