name: Check deployment secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NKAI_DATABASE_URL: ${{ secrets.NKAI_DATABASE_URL }}
      NKAI_BETTER_AUTH_URL: ${{ secrets.NKAI_BETTER_AUTH_URL }}
      NKAI_BETTER_AUTH_SECRET: ${{ secrets.NKAI_BETTER_AUTH_SECRET }}
      NKAI_GOOGLE_CLIENT_ID: ${{ secrets.NKAI_GOOGLE_CLIENT_ID }}
      NKAI_GOOGLE_CLIENT_SECRET: ${{ secrets.NKAI_GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Report secret status (names only)
        shell: bash
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NKAI_DATABASE_URL NKAI_BETTER_AUTH_URL NKAI_BETTER_AUTH_SECRET NKAI_GOOGLE_CLIENT_ID NKAI_GOOGLE_CLIENT_SECRET; do
            if [[ -z "${!key}" ]]; then
              echo "$key: MISSING"
              missing=$((missing + 1))
            else
              echo "$key: SET"
            fi
          done
          if [[ -n "$NKAI_BETTER_AUTH_URL" ]]; then
            if node --input-type=module -e '
              const u = new URL(process.env.NKAI_BETTER_AUTH_URL);
              if (u.protocol !== "https:" || u.pathname !== "/" || u.search || u.hash) process.exit(1);
            ' 2>/dev/null && [[ "$NKAI_BETTER_AUTH_URL" != */ ]]; then
              echo "NKAI_BETTER_AUTH_URL format: OK"
            else
              echo "NKAI_BETTER_AUTH_URL format: INVALID (https origin, no path, no trailing slash)"
              missing=$((missing + 1))
            fi
          fi
          if [[ "$missing" -gt 0 ]]; then
            echo "::error::$missing check(s) failed."
            exit 1
          fi
          echo "All required secrets are set."
