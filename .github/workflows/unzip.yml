
name: Extract ZIP in Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'grok-workspace.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "grok-workspace.zip was not found in the repository."
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          rm -f "$ZIP_FILE"
          cp -a extracted/. .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract grok-workspace ZIP" || echo "No changes to commit"
          git push
