name: NKAI Studio Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate GPU worker Python syntax
        run: python -m compileall -q gpu-worker

      - name: TypeScript check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Download approved starter avatar
        run: npm run assets:download

      - name: Build application
        run: npm run build
