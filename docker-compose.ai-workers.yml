services:
  chat-worker:
    build:
      context: ./gpu-worker
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}
      PORT: "7860"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:4173,http://127.0.0.1:4173}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?Set WORKER_API_TOKEN in your shell or .env file}
    gpus: all
    restart: unless-stopped

  openvoice-worker:
    build:
      context: .
      dockerfile: gpu-worker/Dockerfile.openvoice
    ports:
      - "7861:7861"
    environment:
      PORT: "7861"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:4173,http://127.0.0.1:4173}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?Set WORKER_API_TOKEN in your shell or .env file}
      OPENVOICE_ROOT: /opt/OpenVoice
      OPENVOICE_CHECKPOINT_ROOT: /opt/OpenVoice/checkpoints_v2
      OPENVOICE_REFERENCE_AUDIO: /run/secrets/voice-reference.wav
      DOWNLOAD_OPENVOICE_CHECKPOINTS: ${DOWNLOAD_OPENVOICE_CHECKPOINTS:-true}
    volumes:
      - ${OPENVOICE_CHECKPOINTS_DIR:-./openvoice-checkpoints}:/opt/OpenVoice/checkpoints_v2
      - ${VOICE_REFERENCE_FILE:-./voice-secrets/voice-reference.wav}:/run/secrets/voice-reference.wav:ro
    gpus: all
    restart: unless-stopped
